- id: t211
  row: 211
  year: 2020
  date: 3月27日
  title: 原表线索记录 · 待核实
  tags:
    - together
    - moments
    - zhou
    - dong
  summaries:
    - label: 共同记录
      text: |-
        0：46一个不知名用户在tq超话发帖，表示花从概率角度来说可能不是🍉送的，是cyy送的，删除原因也是因为cyy。
        并在评论中提出2019年5月20日的微博是写给🍉的表白信                       
        后被鹅根据其语言风格推测此用户疑似🍑小号
  observation: >-
    🎺事件

    1.25年据不方便透露信息人员表示，花似乎真的有可能不是🍉送的，至于为什么，就不方便透露了

    2.20年不知名用户与25年人员表述结论相同，即花不是🍉送的

    3.评论中该不知名用户引用王国维的《人间词话》，且该书🍑推荐过。同时该用户说话语气相较于鹅显得老成。

    4.时间：3月27日，327一直以来默认是属于鹅的纪念日，且《致橡树》写于（1977年）3月27日

    5.“最近不方便用大号，小号还改不了名字”、“超话里发🔪会不会不合适”等一系列话都存在不寻常之处，具体可参考后面链接分析

    6.“董小朋友”“这位朋友也好可爱”

    7.假设花不是🍉送的，那就更绝了。评论里该不知名用户说“她很少上微博（至少是大号）......表白信，很绝”这段话可以说是滴水不漏地站在🍑的角度说的，如果这个🎺真的不是🍑，那么这个人也是很有实力了，简直是要素齐全：“岁数大、去花店问问老板、低调死了、发评论配图”等习惯。
